name: deployment-pipeline

on:
  push:
    paths-ignore:
      - '**.md'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      untagged: ${{ steps.read.outputs.untagged }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: read
        run: |
          version=$(make version)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "untagged=false" >> $GITHUB_OUTPUT
          else
            echo "untagged=true" >> $GITHUB_OUTPUT
          fi

  commit:
    needs: version
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - id: swiftlint
        run: command -v swiftlint || brew install swiftlint
      - id: lint
        run: make lint/report
      - id: lint-summary
        if: always()
        run: make lint/summary >> "$GITHUB_STEP_SUMMARY"
      - id: upload-lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftlint
          path: build/swiftlint.sarif
          if-no-files-found: error
      - id: code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/swiftlint.sarif
          category: swiftlint
      - id: build
        run: make build
      - id: test
        run: make test
      - id: release
        env:
          BUILD_NUMBER: ${{ needs.version.outputs.build }}
        run: make release
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: OttoWM
          path: build/OttoWM-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  acceptance:
    needs: [version, commit]
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: download
        uses: actions/download-artifact@v8
        with:
          name: OttoWM
          path: build
      - id: install
        run: |
          ditto -x -k build/OttoWM-${{ needs.version.outputs.version }}.zip /Applications
          xattr -cr /Applications/OttoWM.app
      - id: harness
        run: make build/acceptance build/benchmark
      - id: grant-permissions
        run: |
          brew untap aws/tap || true
          brew install tccutil
          sudo tccutil --insert /Applications/OttoWM.app/Contents/MacOS/OttoWM
          sudo tccutil --enable /Applications/OttoWM.app/Contents/MacOS/OttoWM
          sudo tccutil --insert com.apple.Terminal
          sudo tccutil --enable com.apple.Terminal
          sleep 2
          sudo tccutil --list | grep -q "OttoWM" || exit 1
      - id: log
        run: |
          nohup log stream --style compact --level debug \
            --predicate 'subsystem == "com.github.brennovich.ottowm"' > ottowm.log 2>&1 &
          echo $! > log.pid
      - id: run
        run: make acceptance
      - id: load-test
        run: make benchmark BENCHMARK_ARGS="--iterations 50 --budget-p95 300 --output build/benchmark-1.json"
      - id: stop-log
        if: always()
        run: kill "$(cat log.pid)" 2>/dev/null || true
      - id: screenshot
        if: always()
        run: screencapture -x screen.png || true
      - id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            ottowm.log
            screen.png
          if-no-files-found: warn
      - id: upload-benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: build/benchmark-*.json
          if-no-files-found: warn

  release:
    needs: [version, acceptance]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.untagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - id: download
        uses: actions/download-artifact@v8
        with:
          name: OttoWM
          path: build
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            "build/OttoWM-${{ needs.version.outputs.version }}.zip"
