included:
  - App
  - Core
  - OttoWMTests
  - Acceptance
  - Benchmark
  - Harness
  - Tools

excluded:
  - build

disabled_rules:
  # Trailing commas in multi-line literals are the style used throughout.
  - trailing_comma

opt_in_rules:
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unowned_variable_capture
  - unneeded_parentheses_in_closure_argument
  - weak_delegate

# The accessibility API returns CFTypeRef, so `as!` is how a value is read back;
# `as?` succeeds for any type and would hide the mismatch.
force_cast:
  severity: warning

identifier_name:
  min_length:
    warning: 1
    error: 1

large_tuple:
  warning: 4
  error: 5

line_length:
  warning: 140
  error: 200
  ignores_urls: true

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 450
  error: 600
